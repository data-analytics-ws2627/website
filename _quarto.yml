project:
  type: website
  render:
    - index.qmd
    - course-overview.qmd
    - course-syllabus.qmd
    - course-support.qmd
    - course-materials.qmd
    - programming-requirements.qmd
    - bpmn.qmd
    - coding-agents.qmd
    - agents.qmd
    - data-storytelling.qmd
    - project-description.qmd
    - project-tips-resources.qmd
  resources:
    - code-inputs.js
    - downloads/*
    - bpmn/**

lang: de

execute:
  freeze: auto

website:
  page-navigation: true
  title: "Data Analytics with Generative AI"
  description: "Homepage for Data Analytics with Generative AI at HdM Stuttgart, WS 26/27."
  site-url: "https://data-analytics-ws2627.github.io/website/"
  repo-url: https://github.com/data-analytics-ws2627/website
  repo-actions: [edit, issue]
  open-graph: true
  image: "/images/logo.png"
  favicon: "/images/logo.png"
  search:
    type: overlay  
  page-footer:
    left: |
      © [Jan Kirenz](https://www.kirenz.com/), 2026
    center:
      - text: "Kursstart"
        href: index.qmd
      - text: "Kursbeschreibung"
        href: course-syllabus.qmd  
    right:
      - icon: person-circle
      - text: "Moodle"
        href: https://moodle.hdm-stuttgart.de/login/index.php
        aria-label: Moodle    
#    background: "#325b74"    


  sidebar:
#    background: "#325b74"
    logo: "images/logo.png"
    pinned: true
    align: center
    tools:
      - icon: github
        href: https://github.com/data-analytics-ws2627
        text: "GitHub organization"
      - icon: person-fill
        text: "Moodle"
        href: https://moodle.hdm-stuttgart.de/login/index.php

    style: docked
    search: true
    collapse-level: 1
    contents:
      - section: "Kursinformationen"
        contents:
          - href: course-overview.qmd
            text: Überblick
          - href: course-materials.qmd
            text: Kursplan
          - href: course-syllabus.qmd
            text: Kursbeschreibung
          - href: course-support.qmd
            text: Unterstützung
          - href: index.qmd
            text: Kursstart

      - section: "Materialien"
        contents:
          - bpmn.qmd
          - coding-agents.qmd
          - agents.qmd
          - data-storytelling.qmd

      - section: "Einrichtung"
        contents:
          - href: programming-requirements.qmd
            text: Python-Umgebung
#          - href: programming-troubleshooting.qmd
#            text: Troubleshooting
      - section: "Projekt"
        contents:
          - href: project-description.qmd
            text: Beschreibung
          - href: project-tips-resources.qmd
            text: Hinweise und Quellen


format:
  html:
    css: code-inputs.css
    include-after-body:
      - text: |
          <script src="code-inputs.js"></script>
    toc: true
    theme:
      light: [cosmo, style/course.scss]
      dark: [cosmo, style/course.scss, style/dark.scss]
    mainfont: "Atkinson Hyperlegible"
    code-copy: true
    code-overflow: wrap
